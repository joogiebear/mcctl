<!doctype html>
<meta charset="utf-8">
<title>mcctl</title>
<style>
  :root {
    --bg: #10131a; --panel: #171b24; --line: #262c39; --ink: #e6e9ef; --dim: #8b94a7;
    --accent: #5aa9e6; --ok: #57c07d; --warn: #e0a75e; --bad: #e06c75;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  header span { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim);
              margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .inst { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .inst:last-child { border-bottom: 0; }
  .inst.sel { background: #1e2431; box-shadow: inset 3px 0 0 var(--accent); }
  .inst .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .meta { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .running .dot { background: var(--ok); } .stopped .dot { background: var(--dim); }
  .stale .dot, .orphaned .dot { background: var(--warn); } .unknown .dot { background: var(--bad); }
  .bar { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  button { background: #222836; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
           padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.go { background: #1d3b2a; border-color: #2c5b40; }
  button.stop { background: #3b1f22; border-color: #5b2c31; }
  #log { margin: 0; padding: 12px 14px; height: calc(100vh - 230px); overflow-y: auto; white-space: pre-wrap;
         word-break: break-word; font-family: var(--mono); font-size: 12.5px; color: #cdd3de; }
  #log .err { color: var(--bad); }
  #log .warn { color: var(--warn); }
  .cmd { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .cmd input { flex: 1; background: #0d1017; color: var(--ink); border: 1px solid var(--line);
               border-radius: 6px; padding: 8px 10px; font-family: var(--mono); }
  form.new { padding: 12px 14px; display: grid; gap: 8px; }
  form.new input, form.new select { background: #0d1017; color: var(--ink); border: 1px solid var(--line);
                                    border-radius: 6px; padding: 7px 9px; font: inherit; width: 100%; }
  form.new label { color: var(--dim); font-size: 12px; }
  .mini { width: 116px; background: #0d1017; color: var(--ink); border: 1px solid var(--line);
          border-radius: 6px; padding: 5px 8px; font: inherit; }
  .note { color: var(--dim); font-size: 12px; padding: 0 14px 12px; }
</style>

<header>
  <h1>mcctl</h1>
  <span>local control panel &mdash; bound to 127.0.0.1 only</span>
  <span style="flex:1"></span>
  <span class="meta" id="appver"></span>
  <button id="bUpdate" hidden>Check for updates</button>
</header>

<main>
  <div>
    <div class="panel" style="margin-bottom:16px">
      <h2>Servers</h2>
      <div id="list"></div>
    </div>
    <div class="panel">
      <h2>New server</h2>
      <form class="new" id="newForm">
        <div><label>Name</label><input name="name" required pattern="[A-Za-z0-9_-]+" placeholder="testbed"></div>
        <div><label>Paper version</label><select name="paperVersion" id="versions"><option>loading...</option></select></div>
        <div><label>Memory</label><input name="memory" value="4G"></div>
        <div><label>Port</label><input name="port" type="number" placeholder="auto"></div>
        <button type="submit">Create</button>
      </form>
      <div class="note" id="newNote">Downloads the newest stable build of the chosen version.</div>
    </div>
  </div>

  <div class="panel">
    <div class="bar">
      <b id="curName">&mdash;</b>
      <span class="meta" id="curMeta"></span>
      <span style="flex:1"></span>
      <button class="go" id="bStart">Start</button>
      <button class="stop" id="bStop">Stop</button>
      <button id="bRestart">Restart</button>
    </div>
    <div class="bar" id="manageBar">
      <button id="bFolder" title="Open this instance's folder">Open folder</button>
      <span style="flex:1"></span>
      <input id="edName" class="mini" placeholder="rename to..." autocomplete="off">
      <button id="bRename">Rename</button>
      <input id="edMem" class="mini" placeholder="RAM e.g. 4G" autocomplete="off">
      <input id="edPort" class="mini" type="number" placeholder="port">
      <button id="bSave">Save</button>
      <button id="bRebuild" title="Reset worlds; snapshots first">Rebuild</button>
      <button class="stop" id="bDelete">Delete</button>
    </div>
    <pre id="log"></pre>
    <div class="cmd">
      <input id="cmd" placeholder="Type a server command and press Enter - e.g. list" autocomplete="off">
      <button id="bSend">Send</button>
    </div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let current = null, stream = null;

const api = async (p, opt) => {
  const r = await fetch('/api' + p, opt);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
};

async function refresh() {
  const rows = await api('/instances');
  $('#list').innerHTML = rows.map((i) =>
    '<div class="inst ' + i.status + (i.name === current ? ' sel' : '') + '" data-n="' + i.name + '">' +
      '<div class="row"><b><span class="dot"></span>' + i.name + '</b>' +
      '<span class="meta">' + i.status + '</span></div>' +
      '<div class="meta">:' + (i.port || '?') + ' &middot; ' + (i.memory || '') + ' &middot; ' + (i.jar || '') + '</div>' +
    '</div>').join('') || '<div class="note">No servers yet.</div>';

  for (const el of document.querySelectorAll('.inst')) {
    el.onclick = () => select(el.dataset.n);
  }
  const cur = rows.find((r) => r.name === current);
  $('#curMeta').textContent = cur ? cur.status + ' · :' + cur.port + ' · ' + (cur.jar || '') : '';
  $('#bStart').disabled = !cur || cur.status === 'running';
  $('#bStop').disabled = !cur || cur.status !== 'running';
  $('#bRestart').disabled = !cur;
  // Rename, rebuild and delete all require a stopped server; the core refuses otherwise, and a
  // button that is going to be refused should look refused.
  const live = !cur || cur.status === 'running';
  for (const b of ['#bRename', '#bRebuild', '#bDelete']) $(b).disabled = live;
  $('#bFolder').disabled = !cur;
  $('#bSave').disabled = live;
}

function select(name) {
  current = name;
  $('#curName').textContent = name;
  $('#log').textContent = '';
  if (stream) stream.close();
  // Server-Sent Events rather than polling: the console is a stream by nature, and the browser
  // reconnects on its own if the panel is left open while a server restarts.
  stream = new EventSource('/api/instances/' + name + '/stream');
  stream.onmessage = (e) => {
    const line = JSON.parse(e.data);
    const div = document.createElement('div');
    if (/ ERROR\]/.test(line)) div.className = 'err';
    else if (/ WARN\]/.test(line)) div.className = 'warn';
    div.textContent = line;
    const log = $('#log');
    // Only auto-scroll when already at the bottom, so reading back through history is not yanked
    // away every time a new line arrives.
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.appendChild(div);
    if (atBottom) log.scrollTop = log.scrollHeight;
  };
  refresh();
}

const act = (what) => async () => {
  if (!current) return;
  for (const b of ['#bStart', '#bStop', '#bRestart']) $(b).disabled = true;
  try { await api('/instances/' + current + '/' + what, { method: 'POST' }); }
  catch (e) { alert(e.message); }
  refresh();
};
$('#bStart').onclick = act('start');
$('#bStop').onclick = act('stop');
$('#bRestart').onclick = act('restart');

// Destructive actions confirm by name. A dialog that only says "are you sure" is answered
// reflexively; typing the name is a moment of actually reading which server this is.
function confirmNamed(action, name) {
  const typed = prompt(action + ' "' + name + '"?\n\nType the server name to confirm:');
  return typed === name;
}

$('#bFolder').onclick = async () => {
  if (!current) return;
  try { await api('/instances/' + current + '/reveal', { method: 'POST' }); }
  catch (e) { alert(e.message); }
};

$('#bRename').onclick = async () => {
  const to = $('#edName').value.trim();
  if (!current || !to) return;
  try {
    await api('/instances/' + current + '/rename', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ to }) });
    $('#edName').value = '';
    await refresh();
    select(to);
  } catch (e) { alert(e.message); }
};

$('#bSave').onclick = async () => {
  if (!current) return;
  const body = {};
  if ($('#edMem').value.trim()) body.memory = $('#edMem').value.trim();
  if ($('#edPort').value.trim()) body.port = $('#edPort').value.trim();
  if (!Object.keys(body).length) return;
  try {
    await api('/instances/' + current + '/settings', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body) });
    $('#edMem').value = ''; $('#edPort').value = '';
    refresh();
  } catch (e) { alert(e.message); }
};

$('#bRebuild').onclick = async () => {
  if (!current || !confirmNamed('Reset the worlds of', current)) return;
  const keepPlugins = confirm('Keep plugins?\n\nOK = keep plugins (reset world only)\nCancel = wipe plugins too');
  try {
    const r = await api('/instances/' + current + '/rebuild', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ keepPlugins }) });
    alert('Rebuilt. Snapshot taken first:\n' + (r.snapshot || '(none)'));
    refresh();
  } catch (e) { alert(e.message); }
};

$('#bDelete').onclick = async () => {
  if (!current || !confirmNamed('Delete', current)) return;
  const purge = confirm('Delete the files too?\n\nOK = delete files (snapshot taken first)\nCancel = keep files, remove from mcctl');
  try {
    await api('/instances/' + current + '/delete', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ purge }) });
    current = null;
    $('#curName').textContent = '—';
    $('#log').textContent = '';
    if (stream) stream.close();
    refresh();
  } catch (e) { alert(e.message); }
};

async function send() {
  const box = $('#cmd');
  if (!current || !box.value.trim()) return;
  try {
    await api('/instances/' + current + '/command', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ line: box.value }),
    });
  } catch (e) { alert(e.message); }
  box.value = '';
}
$('#bSend').onclick = send;
$('#cmd').onkeydown = (e) => { if (e.key === 'Enter') send(); };

$('#newForm').onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target).entries());
  $('#newNote').textContent = 'Creating - downloading the server jar if needed...';
  try {
    const inst = await api('/instances', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    $('#newNote').textContent = 'Created ' + inst.name + '.';
    e.target.reset();
    await refresh();
    select(inst.name);
  } catch (err) {
    $('#newNote').textContent = 'Failed: ' + err.message;
  }
};

api('/paper/versions').then((vs) => {
  $('#versions').innerHTML = vs.map((v, i) =>
    '<option value="' + v + '"' + (i === 0 ? ' selected' : '') + '>' + v + (i === 0 ? ' (newest)' : '') + '</option>'
  ).join('');
}).catch(() => {
  $('#versions').innerHTML = '<option value="">(offline - Paper API unreachable)</option>';
});

// ---- desktop-only: version + updates ----------------------------------------
// The same page runs in a plain browser, where window.mcctlDesktop does not exist. Everything here
// is additive and silent when it is absent.
const desktop = window.mcctlDesktop;
if (desktop) {
  desktop.appInfo().then((info) => {
    $('#appver').textContent = 'v' + info.version + (info.packaged ? '' : ' (' + info.coreMode + ')');
    $('#bUpdate').hidden = false;
  });

  let pending = null;
  desktop.onUpdate((kind, data) => {
    const b = $('#bUpdate');
    if (kind === 'available') { pending = data.version; b.textContent = 'Download ' + data.version; b.disabled = false; }
    else if (kind === 'none') { b.textContent = 'Up to date'; b.disabled = true;
                                setTimeout(() => { b.textContent = 'Check for updates'; b.disabled = false; }, 4000); }
    else if (kind === 'progress') { b.textContent = 'Downloading ' + data.percent + '%'; b.disabled = true; }
    else if (kind === 'ready') { b.textContent = 'Restart to install ' + data.version; b.disabled = false; pending = 'ready'; }
    else if (kind === 'error') { b.textContent = 'Update failed'; b.disabled = false; alert('Update error:\n' + data.error); }
  });

  $('#bUpdate').onclick = async () => {
    const b = $('#bUpdate');
    if (pending === 'ready') {
      // Servers survive the restart - they are detached daemons - but saying so beats letting
      // someone guess whether updating will drop their running world.
      if (!confirm('Restart to install?\n\nRunning servers keep running; only this window restarts.')) return;
      await desktop.installUpdate();
      return;
    }
    if (pending) { await desktop.downloadUpdate(); return; }
    b.textContent = 'Checking...'; b.disabled = true;
    const res = await desktop.checkUpdate();
    if (!res.ok) {
      b.textContent = 'Check for updates'; b.disabled = false;
      alert(res.message || 'Could not check for updates.');
    }
  };
}

refresh();
setInterval(refresh, 4000);
</script>
