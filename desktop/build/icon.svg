<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024" role="img" aria-label="SpawnLoft">
  <title>SpawnLoft</title>

  <!--
    One lapis block, seen as a machine.

    Minecraft supplies the cube and the colour - lapis is a block, not a brand blue. The lit vent
    on the shaded face is what makes it a server rather than a generic isometric logo, and it is
    the same signal the panel uses for a running instance.

    Everything here is sized for 16px first. A taskbar icon that only works at 256 is decoration.
  -->

  <defs>
    <linearGradient id="mcctl-top" x1="8" y1="8" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d93f7"/>
      <stop offset="1" stop-color="#4c6fdc"/>
    </linearGradient>
    <linearGradient id="mcctl-left" x1="8" y1="20" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f5cc0"/>
      <stop offset="1" stop-color="#31489e"/>
    </linearGradient>
    <linearGradient id="mcctl-right" x1="56" y1="20" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27397e"/>
      <stop offset="1" stop-color="#1d2c64"/>
    </linearGradient>
    <linearGradient id="mcctl-vent" x1="51.2" y1="29" x2="35.4" y2="42.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a8c6ff"/>
    </linearGradient>
    <filter id="mcctl-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Faces. Light from the upper left, so the vent glows out of the shaded face. -->
  <polygon points="8,20 32,8 56,20 32,32"   fill="url(#mcctl-top)"/>
  <polygon points="8,20 32,32 32,54 8,42"   fill="url(#mcctl-left)"/>
  <polygon points="56,20 32,32 32,54 56,42" fill="url(#mcctl-right)"/>

  <!-- The seams, drawn rather than left to antialiasing, so the block still has three faces at 32px. -->
  <g stroke="#101838" stroke-width="1" stroke-linejoin="round" fill="none" opacity="0.6">
    <polygon points="8,20 32,8 56,20 32,32"/>
    <path d="M32 32 V54"/>
  </g>

  <!-- The vent: the one lit thing, sized to survive the 16px downscale as a bright band. -->
  <g filter="url(#mcctl-glow)">
    <polygon points="51.2,29.0 35.4,36.9 35.4,42.6 51.2,34.7" fill="url(#mcctl-vent)"/>
  </g>

  <!-- Top edge highlight: one hairline, so the block reads as lit from above and not as flat art. -->
  <path d="M8 20 L32 8 L56 20" fill="none" stroke="#a9c0ff" stroke-width="0.9" opacity="0.55" stroke-linejoin="round"/>
</svg>
